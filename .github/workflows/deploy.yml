name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      activate_lifecycle:
        description: Enable lifecycle writes on an already verified state-aware image
        type: boolean
        required: false
        default: false
      lifecycle_cutover_confirmed:
        description: Old revision traffic/tags removed and request timeout drain completed
        type: boolean
        required: false
        default: false
      lifecycle_cutover_evidence:
        description: GitHub evidence URL documenting the completed cutover checks
        type: string
        required: false
      image_tag:
        description: Full commit SHA of the approved image
        required: true
        type: string
      image_digest:
        description: Expected Artifact Registry digest (sha256 followed by 64 hex characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci-docker.yml

  deploy:
    needs: test
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          ((github.event_name == 'push' && needs.test.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && needs.test.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE_NAME: gather
      MIGRATE_JOB_NAME: gather-migrate
      IMAGE_TAG: ${{ github.event_name == 'push' && github.sha || inputs.image_tag }}
      EXPECTED_IMAGE_DIGEST: ${{ inputs.image_digest }}
      ROLLBACK: ${{ github.event_name == 'workflow_dispatch' }}
      ACTIVATE_LIFECYCLE: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_lifecycle || 'false' }}
      LIFECYCLE_CUTOVER_CONFIRMED: ${{ inputs.lifecycle_cutover_confirmed || 'false' }}
      LIFECYCLE_CUTOVER_EVIDENCE: ${{ inputs.lifecycle_cutover_evidence }}
      LIFECYCLE_APPROVED_IMAGES_JSON: ${{ vars.LIFECYCLE_APPROVED_IMAGES_JSON || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify deployment settings and checked-out source
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          : "${PROJECT_ID:?Missing GCP_PROJECT_ID}" "${REGION:?Missing GCP_REGION}"
          : "${WIF_PROVIDER:?Missing WIF_PROVIDER}" "${WIF_SERVICE_ACCOUNT:?Missing WIF_SERVICE_ACCOUNT}"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo 'Image tag must be a full commit SHA.' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$ROLLBACK" == true ]]; then
            [[ "$EXPECTED_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Manual deploy requires the approved SHA-256 image digest.' >&2; exit 1; }
          fi

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push image
        if: github.event_name == 'push'
        run: |
          registry="$REGION-docker.pkg.dev"
          image="$registry/$PROJECT_ID/gather/gather:$IMAGE_TAG"
          gcloud auth configure-docker "$registry" --quiet
          docker build --tag "$image" .
          docker push "$image"

      - name: Verify image, migrate and deploy
        run: bash deploy/release.sh

      - name: Set up Python for smoke checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Smoke test public URL
        run: |
          echo 'SKIP login: optional login smoke is disabled for this release.'
          python3 deploy/smoke_test.py "$SERVICE_URL"

      - name: Record deployment
        run: |
          {
            printf '### Gather demo deployment\n\n'
            if [[ "$ROLLBACK" == true ]]; then
              printf -- '- Mode: manual image reuse (CI, build, push, migration and seed skipped)\n'
            else
              printf -- '- Mode: release from main\n'
            fi
            printf -- '- Commit image tag: `%s`\n' "$IMAGE_TAG"
            printf -- '- Deployed image digest: `%s`\n' "$DEPLOYED_IMAGE"
            printf -- '- Lifecycle writes enabled: `%s`\n' "$ACTIVATE_LIFECYCLE"
            printf -- '- URL: %s\n' "$SERVICE_URL"
            printf -- '- Smoke test: passed (health, readiness, homepage, JavaScript, events)\n'
            printf -- '- SKIP login: optional login smoke is disabled for this release\n'
          } >> "$GITHUB_STEP_SUMMARY"
