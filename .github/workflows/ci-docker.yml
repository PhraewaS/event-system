name: CI & Docker Build
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main, sprint1-staging]
  push:
    branches: [main, "sprint*-staging"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: event_app
          POSTGRES_PASSWORD: ci-synthetic-password
          POSTGRES_DB: event_system_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U event_app -d event_system_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://event_app:ci-synthetic-password@localhost:5432/event_system_test
      TEST_DATABASE_URL: postgresql://event_app:ci-synthetic-password@localhost:5432/event_system_test
      SESSION_SECRET: ci-synthetic-session-secret-at-least-32-characters
      NODE_ENV: test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Setup Python for offline deployment tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Check deployment scripts without accessing GCP
        run: |
          bash -n deploy/deploy.sh deploy/teardown.sh deploy/release.sh
          bash deploy/tests/test_deploy_stub.sh
          bash deploy/tests/test_release_stub.sh
          python3 -m unittest discover -s deploy/tests -p 'test_smoke.py' -v
      - name: Install root dependencies
        run: npm ci
      - name: Verify migration and explicit seed
        env:
          DEMO_PASSWORD: ci-only-synthetic-seed-password
        run: |
          npm run db:migrate
          npm run db:seed
      - name: Build API and frontend
        run: npm run build
        env:
          NODE_ENV: production
      - name: Run unit, API, PostgreSQL and client tests
        run: npm test -- --reporter=verbose
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Verify production Docker build without pushing
        run: docker build -t gather:ci .
      - name: Record source and submitted commit
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: node scripts/evidence.mjs
      - name: Upload source and test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lab5-ci-evidence
          path: artifacts/
          retention-days: 30
  # Preserve the check already required by both protected branches.
  # Episode 6 can additionally require test-and-docker after the reviewed rollout.
  build-and-test:
    name: build-and-test
    needs: test-and-docker
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful CI and Docker checks
        env:
          RESULT: ${{ needs.test-and-docker.result }}
        run: test "$RESULT" = success
